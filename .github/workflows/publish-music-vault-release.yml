name: Publish Music Vault stable release

on:
  push:
    branches:
      - main
    paths:
      - "release-assets/MUSIC_VAULT_RELEASE_VERSION.txt"
      - "release-assets/package-b64/**"
      - ".github/velocity-9.1/**"
      - ".github/velocity-9.2/**"
      - ".github/velocity-9.3/**"
      - "release-assets/velocity-9.4-b64/**"
      - "release-assets/velocity-9.5-b64/**"
      - "release-assets/velocity-9.5.1-b64/**"
      - "release-assets/velocity-9.6-b64/**"
      - ".github/velocity-9.7-b64/**"
      - ".github/velocity-9.8-b64/**"
      - ".github/velocity-9.15/**"
      - ".github/velocity-9.9/**"
      - ".github/velocity-9.10/**"
      - ".github/velocity-9.11/**"
      - ".github/velocity-9.12/**"
      - ".github/velocity-9.13/**"
      - ".github/velocity-9.14/**"
      - ".github/velocity-9.15/**"
      - ".github/velocity-9.16-b64/**"
      - ".github/velocity-9.17-b64/**"
      - ".github/velocity-9.18-b64/**"
      - ".github/velocity-9.19-b64/**"
      - ".github/velocity-9.20/**"
      - ".github/velocity-9.21-b64/**"
      - ".github/velocity-9.22/**"
      - ".github/velocity-9.23/**"
      - ".github/velocity-9.24/**"
      - ".github/velocity-9.24.1/**"
      - ".github/velocity-9.25/**"
      - ".github/velocity-9.26/**"
      - ".github/velocity-9.26.1/**"
      - "release-assets/RELEASE_NOTES.md"
      - ".github/workflows/publish-music-vault-release.yml"
  pull_request:
    paths:
      - "release-assets/MUSIC_VAULT_RELEASE_VERSION.txt"
      - "release-assets/package-b64/**"
      - ".github/velocity-9.1/**"
      - ".github/velocity-9.2/**"
      - ".github/velocity-9.3/**"
      - "release-assets/velocity-9.4-b64/**"
      - "release-assets/velocity-9.5-b64/**"
      - "release-assets/velocity-9.5.1-b64/**"
      - "release-assets/velocity-9.6-b64/**"
      - ".github/velocity-9.7-b64/**"
      - ".github/velocity-9.8-b64/**"
      - ".github/velocity-9.16-b64/**"
      - ".github/velocity-9.17-b64/**"
      - ".github/velocity-9.18-b64/**"
      - ".github/velocity-9.19-b64/**"
      - ".github/velocity-9.20/**"
      - ".github/velocity-9.21-b64/**"
      - ".github/velocity-9.22/**"
      - ".github/velocity-9.23/**"
      - ".github/velocity-9.24/**"
      - ".github/velocity-9.24.1/**"
      - ".github/velocity-9.25/**"
      - ".github/velocity-9.26/**"
      - ".github/velocity-9.26.1/**"
      - "release-assets/RELEASE_NOTES.md"
      - ".github/workflows/publish-music-vault-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-vault-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Build and verify release assets
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < release-assets/MUSIC_VAULT_RELEASE_VERSION.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable semantic version: $VERSION" >&2
            exit 2
          fi
          rm -rf dist
          mkdir -p dist

          if [[ "$VERSION" == "9.26.1" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.26.1/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.26.1/patch_ambient_cards.py dist/stage/patch_ambient_cards.py
            cp .github/velocity-9.26.1/mv926-ambient-cards.css dist/stage/mv926-ambient-cards.css
            cp .github/velocity-9.26.1/tests/test_ambient_cards.py dist/stage/tests/test_ambient_cards.py
            printf '9.26.1\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_ambient_cards.py dist/stage/tests/test_ambient_cards.py
            python3 dist/stage/tests/test_ambient_cards.py
            bash -n dist/stage/install-update.sh
            if grep -Fq '${' dist/stage/install-update.sh; then
              echo "Installer contains escaped Bash variable expansion." >&2
              exit 2
            fi
            grep -Fq 'APP_ROOT="${MUSICVAULT_HOME:-/opt/music-vault}"' dist/stage/install-update.sh
            grep -Fq 'dirname -- "${BASH_SOURCE[0]}"' dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_26_1.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_26_1.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_26_1.txt)
            grep -q '9.26.1' dist/stage/install-update.sh
            grep -q "bestaudio/best" dist/stage/patch_ambient_cards.py
            grep -q 'concurrent_fragment_downloads' dist/stage/patch_ambient_cards.py
            grep -q 'mv81-mood-card' dist/stage/mv926-ambient-cards.css
            grep -q 'mv81-station-card' dist/stage/mv926-ambient-cards.css
            grep -q 'prefers-reduced-motion: reduce' dist/stage/mv926-ambient-cards.css
            test -f dist/stage/tests/test_ambient_cards.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.26.0" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.26/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.26/patch_ambient_cards.py dist/stage/patch_ambient_cards.py
            cp .github/velocity-9.26/mv926-ambient-cards.css dist/stage/mv926-ambient-cards.css
            cp .github/velocity-9.26/tests/test_ambient_cards.py dist/stage/tests/test_ambient_cards.py
            printf '9.26.0\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_ambient_cards.py dist/stage/tests/test_ambient_cards.py
            python3 dist/stage/tests/test_ambient_cards.py
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_26_0.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_26_0.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_26_0.txt)
            grep -q '9.26.0' dist/stage/install-update.sh
            grep -q "bestaudio/best" dist/stage/patch_ambient_cards.py
            grep -q 'concurrent_fragment_downloads' dist/stage/patch_ambient_cards.py
            grep -q '"12"' dist/stage/patch_ambient_cards.py
            grep -q 'http_chunk_size' dist/stage/patch_ambient_cards.py
            grep -q '10\*1024\*1024' dist/stage/patch_ambient_cards.py
            grep -q 'buffersize' dist/stage/patch_ambient_cards.py
            grep -q 'mv81-mood-card' dist/stage/mv926-ambient-cards.css
            grep -q 'mv81-station-card' dist/stage/mv926-ambient-cards.css
            grep -q 'prefers-reduced-motion: reduce' dist/stage/mv926-ambient-cards.css
            grep -q "'-c:a','copy'" dist/stage/install-update.sh
            test -f dist/stage/tests/test_ambient_cards.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.25.0" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.25/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.25/patch_recent_added.py dist/stage/patch_recent_added.py
            cp .github/velocity-9.25/mv925-recent-picks.css dist/stage/mv925-recent-picks.css
            cp .github/velocity-9.25/tests/test_recent_added.py dist/stage/tests/test_recent_added.py
            printf '9.25.0\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_recent_added.py dist/stage/tests/test_recent_added.py
            python3 dist/stage/tests/test_recent_added.py
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_25_0.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_25_0.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_25_0.txt)
            grep -q '9.25.0' dist/stage/install-update.sh
            grep -q 'display: flex !important' dist/stage/mv925-recent-picks.css
            grep -q 'overflow-x: auto !important' dist/stage/mv925-recent-picks.css
            grep -q 'scroll-snap-type: x mandatory !important' dist/stage/mv925-recent-picks.css
            grep -q 'data-mv710-home-album' dist/stage/tests/test_recent_added.py
            test -f dist/stage/tests/test_recent_added.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.24.1" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.24.1/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.24.1/patch_home_downloads.py dist/stage/patch_home_downloads.py
            cp .github/velocity-9.24.1/mv9241-home-repair.js dist/stage/mv9241-home-repair.js
            cp .github/velocity-9.24.1/mv9241-home-repair.css dist/stage/mv9241-home-repair.css
            cp .github/velocity-9.24.1/tests/test_home_downloads.py dist/stage/tests/test_home_downloads.py
            printf '9.24.1\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_home_downloads.py dist/stage/tests/test_home_downloads.py
            python3 dist/stage/tests/test_home_downloads.py
            node --check dist/stage/mv9241-home-repair.js
            bash -n dist/stage/install-update.sh
            if grep -q 'node --check' dist/stage/install-update.sh; then
              echo "Installer must not require Node.js on the CasaOS host." >&2
              exit 2
            fi
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_24_1.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_24_1.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_24_1.txt)
            grep -q '9.24.1' dist/stage/install-update.sh
            grep -q "'concurrent_fragment_downloads':8" dist/stage/patch_home_downloads.py
            grep -q "'http_chunk_size':10\*1024\*1024" dist/stage/patch_home_downloads.py
            grep -q "window.mvLibraryTab('albums')" dist/stage/mv9241-home-repair.js
            grep -q '#page-home #recentAlbums.mv710-recent-grid' dist/stage/mv9241-home-repair.css
            grep -q 'INSTALLER_FAILURE\|FAILURE: step=' dist/stage/install-update.sh
            test -f dist/stage/tests/test_home_downloads.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.24.0" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.24/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.24/patch_home_downloads.py dist/stage/patch_home_downloads.py
            cp .github/velocity-9.24/mv924-home-repair.js dist/stage/mv924-home-repair.js
            cp .github/velocity-9.24/mv924-home-repair.css dist/stage/mv924-home-repair.css
            cp .github/velocity-9.24/tests/test_home_downloads.py dist/stage/tests/test_home_downloads.py
            printf '9.24.0\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_home_downloads.py dist/stage/tests/test_home_downloads.py
            python3 dist/stage/tests/test_home_downloads.py
            node --check dist/stage/mv924-home-repair.js
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_24_0.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_24_0.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_24_0.txt)
            grep -q '9.24.0' dist/stage/install-update.sh
            grep -q "'concurrent_fragment_downloads':8" dist/stage/patch_home_downloads.py
            grep -q "'http_chunk_size':10\*1024\*1024" dist/stage/patch_home_downloads.py
            grep -q "openLibraryHubCategory('albums')" dist/stage/mv924-home-repair.js
            grep -q '#page-home #recentAlbums.mv710-recent-grid' dist/stage/mv924-home-repair.css
            test -f dist/stage/tests/test_home_downloads.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.23.0" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.23/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.23/patch_player_controls.py dist/stage/patch_player_controls.py
            cp .github/velocity-9.23/mv923-player-controls.js dist/stage/mv923-player-controls.js
            cp .github/velocity-9.23/mv923-player-controls.css dist/stage/mv923-player-controls.css
            cp .github/velocity-9.23/tests/test_player_controls.py dist/stage/tests/test_player_controls.py
            printf '9.23.0\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_player_controls.py dist/stage/tests/test_player_controls.py
            python3 dist/stage/tests/test_player_controls.py
            node --check dist/stage/mv923-player-controls.js
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_23_0.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_23_0.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_23_0.txt)
            grep -q '9.23.0' dist/stage/install-update.sh
            grep -q 'window.mv923ClearPlayer' dist/stage/patch_player_controls.py
            grep -q '/api/personal/' dist/stage/mv923-player-controls.js
            grep -q '#miniLike.is-favorite' dist/stage/mv923-player-controls.css
            grep -q 'MutationObserver' dist/stage/mv923-player-controls.js
            test -f dist/stage/tests/test_player_controls.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.22.0" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.22/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.22/patch_android_touch.py dist/stage/patch_android_touch.py
            cp .github/velocity-9.22/mv922-android-touch.css dist/stage/mv922-android-touch.css
            cp .github/velocity-9.22/tests/test_android_touch.py dist/stage/tests/test_android_touch.py
            printf '9.22.0\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_android_touch.py dist/stage/tests/test_android_touch.py
            python3 dist/stage/tests/test_android_touch.py
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_22_0.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_22_0.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_22_0.txt)
            grep -q '9.22.0' dist/stage/install-update.sh
            grep -q 'overflow-y: auto !important' dist/stage/mv922-android-touch.css
            grep -q 'touch-action: pan-x pan-y pinch-zoom !important' dist/stage/mv922-android-touch.css
            grep -q 'MutationObserver' dist/stage/patch_android_touch.py
            test -f dist/stage/tests/test_android_touch.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.21.0" ]]; then
            mkdir -p dist/stage
            mapfile -t PARTS < <(find .github/velocity-9.21-b64 -maxdepth 1 -type f -name 'part-*.b64' -print | sort)
            if [ "${#PARTS[@]}" -ne 5 ]; then
              echo "Expected five ordered Music Vault 9.21.0 package chunks; found ${#PARTS[@]}." >&2
              exit 2
            fi
            for part in "${PARTS[@]}"; do cat "$part"; done > dist/music-vault-9.21.0.b64
            base64 --decode dist/music-vault-9.21.0.b64 > dist/music-vault-casaos-update.zip
            unzip -t dist/music-vault-casaos-update.zip
            unzip -oq dist/music-vault-casaos-update.zip -d dist/stage
            (cd dist/stage && sha256sum -c SHA256SUMS_9_21_0.txt)
            python3 -m py_compile dist/stage/tests/test_profile_library.py
            bash -n dist/stage/install-update.sh
            grep -q '9.21.0' dist/stage/install-update.sh
            grep -q 'expected-v920-source.sha256' dist/stage/install-update.sh
            grep -q 'patch --dry-run' dist/stage/install-update.sh
            grep -q 'track_members' dist/stage/patches/music-vault-9.21.patch
            grep -q 'journal_mode=WAL' dist/stage/patches/music-vault-9.21.patch
            grep -q 'idx_track_members_member_added' dist/stage/patches/music-vault-9.21.patch
            test -s dist/stage/expected-v920-source.sha256
            test -s dist/stage/tests/test_profile_library.py
            test "$(grep -c '^--- a/' dist/stage/patches/music-vault-9.21.patch)" -eq 4
            if unzip -Z1 dist/music-vault-casaos-update.zip | grep -E '(^|/)(music|data|backups|profiles?)/|musicvault\.db'; then
              echo "Unexpected music/database/profile payload found in release ZIP." >&2
              exit 2
            fi
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            rm -f dist/music-vault-casaos-update.zip
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.20.0" ]]; then
            mkdir -p dist/stage/tests
            cp .github/velocity-9.20/install-update.sh dist/stage/install-update.sh
            cp .github/velocity-9.20/patch_android_touch.py dist/stage/patch_android_touch.py
            cp .github/velocity-9.20/mv920-android-touch.css dist/stage/mv920-android-touch.css
            cp .github/velocity-9.20/tests/test_android_touch.py dist/stage/tests/test_android_touch.py
            printf '9.20.0\n' > dist/stage/MUSIC_VAULT_RELEASE_VERSION.txt
            python3 -m py_compile dist/stage/patch_android_touch.py dist/stage/tests/test_android_touch.py
            python3 dist/stage/tests/test_android_touch.py
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && find . -type f ! -name 'SHA256SUMS_9_20_0.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_9_20_0.txt)
            (cd dist/stage && sha256sum -c SHA256SUMS_9_20_0.txt)
            grep -q '9.20.0' dist/stage/install-update.sh
            grep -q 'width=device-width, initial-scale=1, viewport-fit=cover' dist/stage/patch_android_touch.py
            grep -q 'touch-action: pan-x pan-y pinch-zoom !important' dist/stage/mv920-android-touch.css
            grep -q 'touch-action: auto !important' dist/stage/mv920-android-touch.css
            grep -q 'systemctl restart "$SERVICE"' dist/stage/install-update.sh
            grep -q 'rollback' dist/stage/install-update.sh
            test -f dist/stage/tests/test_android_touch.py
            (cd dist/stage && zip -X -qr ../music-vault-casaos-update.zip .)
            unzip -t dist/music-vault-casaos-update.zip
          elif [[ "$VERSION" == "9.19.0" ]]; then
            mkdir -p dist/stage
            base64 --decode .github/velocity-9.19-b64/part-000.b64 > dist/music-vault-casaos-update.zip
            unzip -t dist/music-vault-casaos-update.zip
            unzip -oq dist/music-vault-casaos-update.zip -d dist/stage
            python3 -m py_compile dist/stage/patch_android_touch.py dist/stage/tests/test_android_touch.py
            python3 dist/stage/tests/test_android_touch.py
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            find dist/stage -type f -name '*.pyc' -delete
            (cd dist/stage && sha256sum -c SHA256SUMS_9_19_0.txt)
            grep -q '9.19.0' dist/stage/install-update.sh
            grep -q 'systemctl restart "$SERVICE"' dist/stage/install-update.sh
            grep -q 'Flask template cache refresh' dist/stage/install-update.sh
            grep -q 'cmp -s' dist/stage/install-update.sh
            grep -q 'rollback' dist/stage/install-update.sh
            test -f dist/stage/mv919-android-touch.css
          elif [[ "$VERSION" == "9.18.0" ]]; then
            mkdir -p dist/stage
            base64 --decode .github/velocity-9.18-b64/part-000.b64 > dist/music-vault-casaos-update.zip
            unzip -t dist/music-vault-casaos-update.zip
            unzip -oq dist/music-vault-casaos-update.zip -d dist/stage
            python3 -m py_compile dist/stage/patch_android_touch.py dist/stage/tests/test_android_touch.py
            python3 dist/stage/tests/test_android_touch.py
            bash -n dist/stage/install-update.sh
            find dist/stage -type d -name __pycache__ -prune -exec rm -rf {} +
            (cd dist/stage && sha256sum -c SHA256SUMS_9_18_0.txt)
            grep -q '9.18.0' dist/stage/install-update.sh
            grep -q 'no service-worker edits' dist/stage/patch_android_touch.py
            grep -q 'service worker, playback handlers and existing app assets were not modified' dist/stage/patch_android_touch.py
          elif [[ "$VERSION" == "9.17.0" ]]; then
            mkdir -p dist/stage
