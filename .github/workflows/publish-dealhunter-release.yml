name: Publish DealHunter mobile release
on:
  push:
    branches: [main]
    paths:
      - "dealhunter-release-assets/**"
      - ".github/workflows/publish-dealhunter-release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dealhunter-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Build verified release assets
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < dealhunter-release-assets/DEALHUNTER_RELEASE_VERSION.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version $VERSION" >&2; exit 2; }
          test -s dealhunter-release-assets/package/install-update.sh
          test -s dealhunter-release-assets/package/check-dealhunter-update.sh
          test -s dealhunter-release-assets/package/mobile.html
          rm -rf dist && mkdir -p dist/stage
          cp -a dealhunter-release-assets/package/. dist/stage/
          cp dealhunter-release-assets/DEALHUNTER_RELEASE_VERSION.txt dist/stage/DEALHUNTER_VERSION.txt
          chmod 0755 dist/stage/install-update.sh dist/stage/check-dealhunter-update.sh
          (cd dist/stage && zip -X -qr ../dealhunter-update.zip .)
          SHA256="$(sha256sum dist/dealhunter-update.zip | awk '{print $1}')"
          cp dealhunter-release-assets/RELEASE_NOTES.md dist/RELEASE_NOTES.md
          python3 - "$VERSION" "$SHA256" "$(cat dealhunter-release-assets/RELEASE_NOTES.md)" > dist/dealhunter-update-manifest.json <<'PY'
          import json,sys
          version,digest,notes=sys.argv[1:4]
          print(json.dumps({"schema":1,"version":version,"asset":"dealhunter-update.zip","sha256":digest,"notes":notes[:4000]},indent=2))
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=dealhunter-v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/dealhunter-update.zip dist/dealhunter-update-manifest.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/dealhunter-update.zip dist/dealhunter-update-manifest.json --title "DealHunter ${{ steps.build.outputs.version }}" --notes-file dist/RELEASE_NOTES.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
