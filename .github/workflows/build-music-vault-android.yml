name: Build T88 Android Apps
on:
  push:
    branches: [main, music-vault-android-car-screen-v1]
    paths:
      - "android/music-vault/**"
      - "android/jarvis/**"
      - ".github/workflows/build-music-vault-android.yml"
  pull_request:
    paths:
      - "android/music-vault/**"
      - "android/jarvis/**"
      - ".github/workflows/build-music-vault-android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android app sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore stable signing key for repeat installs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: t88-android-debug-signing-v1
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Music Vault APK
        run: gradle --no-daemon --stacktrace -p android/music-vault :app:assembleDebug
      - name: Build JARVIS APK
        run: gradle --no-daemon --stacktrace -p android/jarvis :app:assembleDebug
      - name: Verify and stage both signed APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          MV="android/music-vault/app/build/outputs/apk/debug/app-debug.apk"
          JV="android/jarvis/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$MV"
          test -s "$JV"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$MV"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$JV"
          cp "$MV" dist/MusicVault-T88-1.1.0.apk
          cp "$JV" dist/JARVIS-T88-1.0.0.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: T88-Android-APKs
          path: |
            dist/MusicVault-T88-1.1.0.apk
            dist/JARVIS-T88-1.0.0.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish T88 APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="t88-apps-1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MusicVault-T88-1.1.0.apk dist/JARVIS-T88-1.0.0.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/MusicVault-T88-1.1.0.apk dist/JARVIS-T88-1.0.0.apk dist/SHA256SUMS.txt \
              --title "T88 Android Apps — Music Vault 1.1.0 + JARVIS 1.0.0" \
              --notes "Sideloadable landscape apps for T88. Music Vault connects to the CasaOS Music Vault server; JARVIS connects to the self-hosted JARVIS server over Tailscale." \
              --target "$GITHUB_SHA"
          fi
